; Overrides for the www pool. The ping endpoint is what the container
; healthcheck exercises — php-fpm speaks FastCGI, so an HTTP check against
; /up cannot run inside this container. That check lives on the web (Caddy)
; service instead.
[www]
ping.path = /ping
ping.response = pong

; Log worker output to the container's stderr rather than a file nobody reads.
catch_workers_output = yes
decorate_workers_output = no

; The base php:8.5-fpm image ships pm.max_children = 5 and this pool never
; overrode it, so a self-hosted box could serve at most 5 concurrent PHP
; requests while docker/prod/php.ini grants each worker up to 512M
; (memory_limit). Sizing below budgets 4096M (4 GiB) of host RAM for this
; pool — a reasonable reservation on a modest self-hosted box that also runs
; Postgres, Redis and the OS alongside this container — divided by that
; 512M-per-worker ceiling: 4096 / 512 = 8. start/min-spare/max-spare scale
; off that same max_children the usual way (start low, keep a small spare
; pool, cap the spare pool below max_children).
;
; php-fpm expands ${VAR} (with an optional :-default) in its own pool conf
; files at parse time — confirmed with `php-fpm -tt` against this image's
; php:8.5-fpm base — so every value below can be overridden per-deployment
; via the container environment without editing this file or building a new
; image.
pm = dynamic
pm.max_children = ${FPM_PM_MAX_CHILDREN:-8}
pm.start_servers = ${FPM_PM_START_SERVERS:-2}
pm.min_spare_servers = ${FPM_PM_MIN_SPARE_SERVERS:-2}
pm.max_spare_servers = ${FPM_PM_MAX_SPARE_SERVERS:-4}
