; Overrides for the www pool. The ping endpoint is what the container
; healthcheck exercises — php-fpm speaks FastCGI, so an HTTP check against
; /up cannot run inside this container. That check lives on the nginx
; service instead.
[www]
ping.path = /ping
ping.response = pong

; Log worker output to the container's stderr rather than a file nobody reads.
catch_workers_output = yes
decorate_workers_output = no
