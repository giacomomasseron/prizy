; Production PHP settings for the Prizy image. Loaded last (zz- prefix) so it
; overrides anything the base image or an extension drops into conf.d.

; The code inside the image is immutable, so opcache never needs to stat it.
opcache.enable=1
opcache.enable_cli=0
opcache.validate_timestamps=0
opcache.memory_consumption=192
opcache.max_accelerated_files=20000
opcache.interned_strings_buffer=16

; Never leak a stack trace to a customer; logs go to stderr, which the
; container runtime collects.
display_errors=Off
display_startup_errors=Off
log_errors=On
error_log=/dev/stderr

expose_php=Off
memory_limit=512M
upload_max_filesize=25M
post_max_size=25M

; Caddy's php_fastcgi directive passes SCRIPT_FILENAME explicitly and refuses
; paths that do not exist; with fix_pathinfo on, fpm would resolve upward to a
; different file than the URL named.
cgi.fix_pathinfo=0
