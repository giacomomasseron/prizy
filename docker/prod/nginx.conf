# nginx in front of php-fpm. Static files are served from the copy of
# public/ baked into this image; everything else goes to the app container
# over FastCGI.
server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Tenant hostnames are arbitrary subdomains, so no host filtering here —
    # the application resolves the tenant from the Host header itself.
    client_max_body_size 25m;

    # Hashed filenames: safe to cache hard, and they never collide.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # Only index.php is ever executed; anything else that ends in .php
        # is a probe, not a route. Refuse to pass a nonexistent path to fpm
        # at all — without this, fpm (with cgi.fix_pathinfo left on) would
        # resolve SCRIPT_FILENAME upward and could execute a different file
        # than the URL named.
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_hide_header X-Powered-By;
    }

    # Never serve dotfiles.
    location ~ /\. {
        deny all;
    }
}
