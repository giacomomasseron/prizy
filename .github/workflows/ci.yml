name: CI
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare env file
        run: cp .env.example .env

      - name: Build app image
        run: docker compose build app

      - name: Start core services (app + postgres + redis)
        run: docker compose up -d

      - name: Install dependencies
        run: docker compose exec -T app composer install --no-interaction --prefer-dist

      - name: Generate app key
        run: docker compose exec -T app php artisan key:generate

      - name: Create test database and grant app role privileges
        run: |
          docker compose exec -T postgres psql -U prizy -d prizy -c "CREATE DATABASE prizy_test;" || true
          docker compose exec -T postgres psql -U prizy -d prizy_test -c "
            GRANT CONNECT ON DATABASE prizy_test TO prizy_app;
            GRANT ALL PRIVILEGES ON DATABASE prizy_test TO prizy_app;
            GRANT ALL ON SCHEMA public TO prizy_app;
            ALTER DEFAULT PRIVILEGES FOR ROLE prizy IN SCHEMA public
              GRANT SELECT, INSERT, UPDATE, DELETE, TRUNCATE, REFERENCES, TRIGGER ON TABLES TO prizy_app;
            ALTER DEFAULT PRIVILEGES FOR ROLE prizy IN SCHEMA public
              GRANT ALL ON SEQUENCES TO prizy_app;
            ALTER DEFAULT PRIVILEGES FOR ROLE prizy IN SCHEMA public
              GRANT EXECUTE ON FUNCTIONS TO prizy_app;
          "

      - name: Architecture gate (deptrac — BLOCKING)
        run: docker compose exec -T app vendor/bin/deptrac analyse --config-file=deptrac.yaml --no-progress

      - name: Lint (mago — non-blocking baseline)
        run: docker compose exec -T app vendor/bin/mago lint || true

      - name: Rector dry-run (non-blocking baseline)
        run: docker compose exec -T app vendor/bin/rector process --dry-run || true

      - name: Migrate (sanity, dev DB)
        run: docker compose exec -T app php artisan migrate --force

      - name: Run tests
        run: docker compose exec -T app php artisan test

      # filo performance gate (BLOCKING): re-run the suite traced; any Feature
      # test slower than phpunit.xml's 3000 ms threshold fails, naming the
      # slowest function. Tests with a cost that isn't request performance set
      # their own ceiling with $this->threshold(ms).
      - name: Performance gate (filo — >3s fails)
        run: docker compose exec -T -e FILO_ENABLED=1 app php artisan test

      - name: Upload filo traces on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: filo-traces
          path: .filo/traces/

      # The production image is what self-hosted installs build (P-1). It has
      # no test suite of its own; scripts/test-prod-image.sh asserts the
      # properties that only exist at the image level — the app is baked in,
      # build tooling did not leak in, it runs unprivileged.
      - name: Production image builds and passes smoke tests
        run: bash scripts/test-prod-image.sh
